services:
  api:
    environment:
      KITAI_LIBRETRANSLATE_URL: http://libretranslate:5000

  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,ru,zh
      LT_UPDATE_MODELS: "${KITAI_LT_UPDATE_MODELS:-false}"
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    volumes:
      - libretranslate_models:/home/libretranslate/.local

volumes:
  libretranslate_models:
